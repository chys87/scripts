set -g mouse on
set -g mode-keys vi

# look good
set -g default-terminal "tmux-256color"

# Increase history-limit
set -g history-limit 10000

# status indicators
#set -g status-right '#(uptime | cut -d, -f 2-)'

#### COLOUR

# Highlight the active window with a black background and white text;
# everything else stays at tmux defaults
set -g window-status-current-style "fg=colour15,bg=black"
# A bell in another window: make the whole entry bright red + bold
set -g window-status-bell-style "fg=colour196,bold"
# Monitor background windows for output and flag them in the status line;
# activity windows: slightly lighter than the normal black text
set -g monitor-activity on
set -g window-status-activity-style "fg=colour18"
# Make the active pane easier to spot: dim the background of inactive panes
set -g window-style 'bg=colour234'
# (`bg=default` would NOT override window-style; `bg=terminal` does)
set -g window-active-style 'bg=terminal'

# Reduce the stupid Esc wait. Absolutely unnecessary on modern Linux,
# but Cygwin's mintty appears to require it.
# Now that I don't use mintty often, let's reduce it from 1000 to 50
set-option -sg escape-time 50
set-option -sg xterm-keys on

# Forward focus events to panes (Claude Code uses them for notifications)
set-option -sg focus-events on
# Copy selections to the system clipboard via OSC52 (works over SSH)
set-option -sg set-clipboard on
# Let pane applications send escape sequences to the outer terminal
set-option -sg allow-passthrough on
# Forward extended keys (C-Tab, C-S-arrows, distinguish C-i from Tab)
set-option -sg extended-keys on

# Set window title
set-option -g set-titles on
set-option -g set-titles-string "#T [tmux #I]"
# Allow applications to rename windows
set-option -g allow-rename on

# Unset SHLVL
set-environment -g -u SHLVL

# Shell shell to zsh
set-option -g default-shell /bin/zsh

# Local config
source-file -q ~/.tmux.local.conf
